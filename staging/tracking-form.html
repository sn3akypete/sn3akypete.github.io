<html>

<head>

<body>
	<h1>Testing a tracking form</h1>
	<form id="my-excellent-form">
		<p><label for="firstname">First name</label>
			<input id="firstname" type="text" />
		</p>
		<p><label for="lastname">Last name</label>
			<input id="lastname" type="text" />
		</p>
		<p><label for="email">Email</label>
			<input id="email" type="email" />
		</p>
		<p><label for="phone">Phone</label>
			<input id="phone" type="text" />
		</p>
		<p><label for="birthday-new">Birthday</label>
			<input id="birthday-new" type="date" />
		</p>
		<p><label for="other">Other comments</label>
			<input id="other" type="text" />
		</p>
		<p><label for="number-update">Number</label>
			<input id="number-update" type="number" />
		</p>
		<p><label for="text">Some text</label>
			<input id="text" type="text" />
		</p>
		<button type="submit">Submit</button>
	</form>
</body>

</html>
